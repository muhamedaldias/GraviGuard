name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # pnpm must be installed BEFORE setup-node so `cache: pnpm` can resolve it.
      # Version matches the packageManager field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Report every severity (incl. moderate/low) without failing the job.
      - name: Audit (report all severities)
        run: pnpm audit --audit-level info
        continue-on-error: true

      # Gate: non-zero exit only for high/critical advisories.
      - name: Audit (gate on high+)
        run: pnpm audit --audit-level high